name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android-app/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle new Fanchen Wendao into APK
        run: |
          rm -rf android-app/app/src/main/assets/www
          mkdir -p android-app/app/src/main/assets/www
          cp index.html android-app/app/src/main/assets/www/index.html

      - name: Build APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release/fanchen-wendao.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanchen-wendao-android
          path: release/fanchen-wendao.apk
          retention-days: 30

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          git push origin :refs/tags/android-latest || true
          gh release create android-latest release/fanchen-wendao.apk \
            --title '凡尘问道 Android 新版' \
            --notes '新版十一卷长线仙途。游戏本体已打包进 APK，不依赖 GitHub Pages 或 ChatGPT。'
